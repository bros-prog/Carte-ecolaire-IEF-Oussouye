name: Construire le logiciel Windows (.exe)
on:
  push:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Carte-scolaire-IEF-Oussouye-exe
          path: dist/*.exe
