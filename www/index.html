<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte scolaire – IEF Oussouye</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#14213d;--mu:#5b6578;--pr:#0b6b3a;--bl:#14316b;--bd:#d3dae6;--bad:#c42033}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#19212f;--tx:#eaf0fa;--mu:#9aa8bf;--pr:#3fbf7f;--bl:#8fb0ff;--bd:#2d394d;--bad:#ff7a85}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--bl);color:#fff;padding:10px 14px;border-bottom:5px solid;border-image:linear-gradient(90deg,#0b6b3a 33%,#f2c230 33% 66%,#d62839 66%) 1}
header b{font-size:18px}header small{display:block;opacity:.85}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:12px;max-width:1150px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 6px;font-size:15px;color:var(--bl)}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ck{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--tx)}.ck input{width:auto}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer;margin:4px 4px 4px 0}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center}th{background:var(--bg)}
td.l{text-align:left}td input{padding:4px;text-align:center;min-width:60px}
.mu{color:var(--mu);font-size:12px}.logo{display:block;width:100%;max-width:760px;margin:0 auto 12px;border-radius:10px;border:1px solid var(--bd)}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kp{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:8px;padding:8px 10px}.kp b{display:block;font-size:24px}.kp span{font-size:12px;color:var(--mu)}
.br{display:flex;align-items:center;gap:8px;margin:5px 0}.br span{width:130px;font-size:13px}.br i{display:block;height:14px;border-radius:3px;min-width:2px}.br em{font-style:normal;font-size:13px}
.tg{color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap}
.rh img{display:block;margin:0 auto;width:100%;max-width:460px;max-height:60mm;object-fit:contain}
footer{text-align:center;color:var(--mu);font-size:12px;padding:14px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#333;--bd:#888;--bl:#000}header,nav,.np,footer{display:none!important}body{background:#fff}main{padding:0}.card{border:0;padding:0}@page{size:A4 landscape;margin:8mm}table{font-size:11px}}
</style>
</head>

const K='carte_scolaire_ief_v1';
const NIV={pre:['Préscolaire',['PS','MS','GS'],'#d9731a'],ele:['Élémentaire',['CI','CP','CE1','CE2','CM1','CM2'],'#0b6b3a'],moy:['Moyen',['6e','5e','4e','3e'],'#1d3f8a'],sec:['Secondaire',['Seconde','Première L1','Première L2','Première S1','Première S2','Terminale L1','Terminale L2','Terminale S1','Terminale S2'],'#7137a8']};
const NL=Object.entries(NIV).map(([k,v])=>[k,v[0]]);
const STT=['Public','Privé laïc','Privé confessionnel','Communautaire','Franco-arabe'];
const PER=['Fonctionnaires','Contractuels'];
const INF=[['elec','Électricité'],['eau','Point d’eau'],['clot','Clôture'],['cant','Cantine'],['bib','Bibliothèque'],['inet','Internet'],['terr','Terrain de sport'],['bur','Bureau du directeur']];
const def=()=>({info:{ia:'ZIGUINCHOR',ief:'OUSSOUYE',annee:'2025 - 2026',insp:''},communes:['Oussouye','Mlomp','Diembéring','Santhiaba Manjacque','Oukout'],norme:{pre:30,ele:40,moy:45,sec:45},ecoles:[],eff:{},pers:{}});
let S;try{S={...def(),...JSON.parse(localStorage.getItem(K))}}catch(e){S=def()}
// Migration des données de la version 1.0.0 : ajout du cycle secondaire et de sa norme.
S.norme={...def().norme,...(S.norme||{})};
S.ecoles=(S.ecoles||[]).map(e=>{const nom=String(e.nom||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(e.niv==='moy'&&/lycee|lycée|terminal|seconde/.test(nom))e.niv='sec';return e});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=x=>+x||0,uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),AN=()=>S.info.annee;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const opt=(L,v,all)=>(all!=null?`<option value="">${all}</option>`:'')+L.map(x=>{const[k,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`}).join('');
const pc=(a,b)=>b?(100*a/b).toFixed(1)+' %':'–',rt=(a,b)=>b?(a/b).toFixed(1):'–';
const isApp=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function doPrint(){if(isApp()&&Capacitor.Plugins.PrintBridge)Capacitor.Plugins.PrintBridge.print();else window.print()}
function dl(name,data,type){if(isApp()){const P=Capacitor.Plugins;P.Filesystem.writeFile({path:name,data,directory:'CACHE',encoding:'utf8'}).then(r=>P.Share.share({title:name,url:r.uri})).catch(e=>alert('Export impossible : '+(e.message||e)));return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const EF=id=>((S.eff[AN()]||{})[id])||{},PS=id=>((S.pers[AN()]||{})[id])||{};
function ec(e){const d=EF(e.id),p=PS(e.id);let g=0,f=0,dv=0,ph=0,pf=0;
 for(const c of NIV[e.niv][1]){const x=d[c]||{};g+=n(x.g);f+=n(x.f);dv+=n(x.d)}
 for(const k of PER){const x=p[k]||[];ph+=n(x[0]);pf+=n(x[1])}
 return{g,f,t:g+f,dv,ph,pf,pt:ph+pf,def:Math.max(0,Math.ceil((g+f)/S.norme[e.niv])-n(e.sd))}}
function agg(L){const r={n:L.length,g:0,f:0,t:0,dv:0,pt:0,sd:0,ab:0,def:0};L.forEach(e=>{const c=ec(e);r.g+=c.g;r.f+=c.f;r.t+=c.t;r.dv+=c.dv;r.pt+=c.pt;r.sd+=n(e.sd);r.ab+=n(e.ab);r.def+=c.def});return r}
const rowA=(l,r)=>`<tr><td class="l">${l}</td><td>${r.n}</td><td>${r.dv}</td><td>${r.g}</td><td>${r.f}</td><td><b>${r.t}</b></td><td>${pc(r.f,r.t)}</td><td>${rt(r.t,r.dv)}</td><td>${r.pt}</td><td>${rt(r.t,r.pt)}</td><td>${r.sd}</td><td>${r.ab}</td><td>${r.def}</td></tr>`;
const STH='<tr><th></th><th>Écoles</th><th>Groupes pédagogiques</th><th>Garçons</th><th>Filles</th><th>Total</th><th>% filles</th><th>Élèves / groupe péd.</th><th>Enseignants</th><th>Élèves / ens.</th><th>Salles en dur</th><th>Abris prov.</th><th>Déficit salles</th></tr>';
let tab='home',ed=null,D=null,cur='',RP='liste',F={q:'',niv:'',com:'',st:''},mv={pre:1,ele:1,moy:1};
const TABS=[['home','Accueil'],['eco','Établissements'],['eff','Effectifs'],['sta','Statistiques'],['car','Carte'],['rap','Rapports'],['sv','Données']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#sub').textContent=`IEF ${S.info.ief} – Année scolaire ${S.info.annee}`}
function go(k){tab=k;ed=null;nav();render();scrollTo(0,0)}
function render(){({home,eco,eff,sta,car,rap,sv})[tab]()}
const fl=()=>S.ecoles.filter(e=>(!F.niv||e.niv===F.niv)&&(!F.com||e.com===F.com)&&(!F.st||e.stt===F.st)&&(!F.q||(e.nom+' '+e.loc).toLowerCase().includes(F.q.toLowerCase())));
function home(){const i=S.info,L=S.ecoles,A=agg(L),kp=(v,l)=>`<div class="kp"><b>${v}</b><span>${l}</span></div>`,
 bars=a=>a.map(([l,v,m,c])=>`<div class="br"><span>${l}</span><i style="width:${m?70*v/m:0}%;background:${c}"></i><em>${v}</em></div>`).join(''),
 mx=Math.max(1,...Object.keys(NIV).map(k=>agg(L.filter(e=>e.niv===k)).t)),
 cov=[...INF.map(([k,l])=>[l,L.filter(e=>e[k]).length]),['Latrines',L.filter(e=>n(e.lg)+n(e.lf)>0).length]];
 $('#v').innerHTML=`<img class="logo" src="${LOGO}" alt="IEF Oussouye – Bureau Planification et Statistiques">
<div class="card"><h2>Identification</h2><div class="g">${[['ia','IA'],['ief','IEF'],['annee','Année scolaire'],['insp','Inspecteur / Chef de bureau']].map(([k,l])=>`<div><label>${l}</label><input value="${esc(i[k])}" oninput="S.info.${k}=this.value;save();nav()"></div>`).join('')}</div></div>
<div class="kps">${kp(L.length,'Établissements')}${Object.keys(NIV).map(k=>kp(L.filter(e=>e.niv===k).length,NIV[k][0])).join('')}${kp(A.t,'Élèves')}${kp(pc(A.f,A.t),'Filles')}${kp(A.pt,'Enseignants')}${kp(A.dv,'Groupes pédagogiques')}${kp(A.ab,'Abris provisoires')}</div>
<div class="card"><h2>Élèves par niveau</h2>${bars(Object.keys(NIV).map(k=>[NIV[k][0],agg(L.filter(e=>e.niv===k)).t,mx,NIV[k][2]]))}</div>

 $('#v').innerHTML=`<div class="card np"><h2>Établissements (${S.ecoles.length})</h2><div class="row"><div><label>Recherche</label><input value="${esc(F.q)}" oninput="F.q=this.value;lst()"></div><div><label>Niveau</label><select onchange="F.niv=this.value;lst()">${opt(NL,F.niv,'Tous')}</select></div><div><label>Commune</label><select onchange="F.com=this.value;lst()">${opt(S.communes,F.com,'Toutes')}</select></div><div><label>Statut</label><select onchange="F.st=this.value;lst()">${opt(STT,F.st,'Tous')}</select></div></div><button class="btn" onclick="newE()">+ Nouvel établissement</button><button class="btn s" onclick="$('#fimp').click()">Importer une liste</button><button class="btn s" onclick="modele()">Modèle CSV</button><input id="fimp" type="file" hidden accept=".csv,.xlsx,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="impL(this.files[0]);this.value=''"><p class="mu">Importez un fichier Excel (.xlsx) ou CSV : 1re ligne = en-têtes, seule la colonne « Établissement » est obligatoire. Les établissements déjà présents (même nom et même niveau) sont mis à jour.</p></div><div class="card"><div class="tw" id="lst"></div></div>`;lst()}
